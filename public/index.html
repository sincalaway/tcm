<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>中医经方 · 辨证施治速查</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      background: #f6f7f9;
      margin: 0;
      padding: 16px;
    }
    h1 {
      text-align: center;
      color: #222;
    }
    .search {
      margin: 20px auto;
      max-width: 500px;
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 10px;
      font-size: 16px;
    }
    button {
      padding: 10px 16px;
      font-size: 16px;
      cursor: pointer;
    }
    .card {
      background: #fff;
      padding: 16px;
      margin: 12px auto;
      max-width: 700px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,.08);
    }
    .tag {
      display: inline-block;
      background: #e6f0ff;
      color: #3366cc;
      padding: 2px 8px;
      border-radius: 4px;
      margin-right: 6px;
      font-size: 12px;
    }
    footer {
      text-align: center;
      font-size: 13px;
      color: #999;
      margin-top: 40px;
    }
  </style>
</head>
<body>

<h1>🌿 中医经方 · 辨证施治查询</h1>

<div class="search">
  <input id="kw" placeholder="输入 病名 / 证型 / 方名（如：感冒、少阳证、小柴胡汤）"/>
  <button onclick="search()">查询</button>
</div>

<div id="result"></div>

<footer>
  本工具仅供学习参考 · 不替代医生诊疗
</footer>

<script>
const DATA = [
  {
    name: "小柴胡汤",
    source: "《伤寒论》",
    composition: ["柴胡", "黄芩", "半夏", "人参", "甘草", "生姜", "大枣"],
    syndrome: "少阳证",
    symptoms: "寒热往来、胸胁苦满、口苦、咽干、目眩",
    principle: "和解少阳",
    indications: ["感冒", "发热", "肝胆不和"]
  },
  {
    name: "桂枝汤",
    source: "《伤寒论》",
    composition: ["桂枝", "白芍", "生姜", "大枣", "甘草"],
    syndrome: "风寒表虚证",
    symptoms: "发热汗出、恶风、头痛",
    principle: "解肌发表、调和营卫",
    indications: ["感冒", "头痛"]
  },
  {
    name: "六味地黄丸",
    source: "《小儿药证直诀》",
    composition: ["熟地黄", "山茱萸", "山药", "泽泻", "牡丹皮", "茯苓"],
    syndrome: "肾阴虚",
    symptoms: "腰膝酸软、头晕耳鸣、盗汗",
    principle: "滋阴补肾",
    indications: ["肾虚", "糖尿病", "更年期"]
  }
];

function search() {
  const kw = document.getElementById("kw").value.trim();
  const result = document.getElementById("result");
  result.innerHTML = "";

  if (!kw) return;

  const list = DATA.filter(i =>
    i.name.includes(kw) ||
    i.syndrome.includes(kw) ||
    i.indications.join("").includes(kw)
  );

  if (list.length === 0) {
    result.innerHTML = "<div class='card'>未找到相关内容</div>";
    return;
  }

  list.forEach(i => {
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `
      <h3>${i.name}</h3>
      <div class="tag">${i.source}</div>
      <p><b>证型：</b>${i.syndrome}</p>
      <p><b>治则治法：</b>${i.principle}</p>
      <p><b>症状：</b>${i.symptoms}</p>
      <p><b>组成：</b>${i.composition.join("、")}</p>
      <p><b>常见病：</b>${i.indications.join("、")}</p>
    `;
    result.appendChild(el);
  });
}
</script>

</body>
</html>
